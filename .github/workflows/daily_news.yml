name: Daily Fund News Fetcher

on:
  schedule:
    # 每天 UTC 时间 0:00 运行（对应北京时间早上 8:00）
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许你在 GitHub 网页端手动触发运行

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许 Action 提交代码到你的仓库

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run script to fetch news
      run: python fetch_news.py

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add news/ README.md
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-fetch daily news: $(date +'%Y-%m-%d')" && git push)
